name: Build Nova Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil Source Code
      uses: actions/checkout@v4

    - name: Menyiapkan Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Menggunakan Mesin Gradle 8.4 (Versi yang Cocok)
      run: gradle wrapper --gradle-version 8.4

    - name: Merakit APK Android (Assemble Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Menyimpan Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: NovaAgent-V3-APK
        path: app/build/outputs/apk/debug/app-debug.apk
