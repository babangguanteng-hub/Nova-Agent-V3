name: Build Nova Agent APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil Source Code
      uses: actions/checkout@v3

    - name: Menyiapkan Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Memberikan Izin Eksekusi pada Gradle Wrapper Lokal
      run: chmod +x gradlew

    - name: Merakit APK Android (Assemble Debug)
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Menyimpan Hasil APK
      uses: actions/upload-artifact@v3
      with:
        name: Nova-Agent-V3-APK
        path: app/build/outputs/apk/debug/app-debug.apk
