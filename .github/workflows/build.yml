name: Build Nova Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan build manual jika diperlukan

jobs:
  build:
    runs-on: ubuntu-latest # Robot GitHub menggunakan Linux Ubuntu

    steps:
    - name: Mengambil Source Code
      uses: actions/checkout@v4

    - name: Menyiapkan Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Merakit APK Android (Assemble Debug)
      run: |
        gradle wrapper
        ./gradlew assembleDebug

    - name: Menyimpan Hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: NovaAgent-V3-APK
        path: app/build/outputs/apk/debug/app-debug.apk
